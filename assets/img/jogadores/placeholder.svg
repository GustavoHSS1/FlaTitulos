<svg xmlns="http://www.w3.org/2000/svg" width="400" height="533" viewBox="0 0 400 533" role="img" aria-labelledby="title desc">
  <title id="title">Imagem do jogador</title>
  <desc id="desc">Espaço reservado para foto do jogador</desc>
  <rect width="400" height="533" fill="#111111"/>
  <rect x="0" y="0" width="400" height="533" fill="url(#gradient)" opacity="0.2"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff0000"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
  </defs>
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="24">Foto do jogador</text>
</svg>